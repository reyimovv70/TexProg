<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="C:\Users\Student\Project\programming-languages-and-technologies\PR4\task7\style.css">
</head>
<body>

<div class="container">
    <h1>Регистрация</h1>

    <form id="registrationForm">

        <label for="login">Логин:</label>
        <input type="text" id="login" placeholder="Введите логин">
        <p class="error" id="loginError"></p>

        <label for="email">E-mail:</label>
        <input type="email" id="email" placeholder="example@mail.com">
        <p class="error" id="emailError"></p>

        <label for="password">Пароль:</label>
        <input type="password" id="password" placeholder="Минимум 8 символов">

        <div id="passwordStatus">
            Пароль должен содержать минимум 8 символов
        </div>

        <p class="error" id="passwordError"></p>

        <label for="confirmPassword">Повторите пароль:</label>
        <input type="password" id="confirmPassword">
        <p class="error" id="confirmError"></p>

        <button type="submit">Зарегистрироваться</button>
    </form>

    <div id="message"></div>
</div>

<script src="script.js"></script>
</body>
</html>
