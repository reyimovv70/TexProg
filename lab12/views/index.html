<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0}main{max-width:520px;margin:40px auto;background:#fff;padding:24px;border-radius:10px;box-shadow:0 2px 8px #0002}form{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}input{flex:1;padding:8px;border:1px solid #bbb;border-radius:6px}button{padding:8px 14px;border:0;border-radius:6px;background:#2d6cdf;color:#fff;cursor:pointer}.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}li{padding:6px 0;border-bottom:1px solid #eee}.hint{color:#777;font-size:13px}#status{min-height:1.4em}.err{color:#c0392b}.ok{color:#1e8449}</style>
</head>
<body><main>
  <h1>Вход в систему</h1>
  <form id="loginForm" novalidate>
    <input id="login" placeholder="Логин" autocomplete="username">
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button>Войти</button>
  </form>
  <p class="hint">Тестовые записи: student1 / Student#2026 (студент), teacher1 / Teacher#2026 (преподаватель)</p>
  <p id="status" role="status"></p>
</main>
<script>
const $ = (s) => document.querySelector(s);
const msg = (t, c = '') => { $('#status').textContent = t; $('#status').className = c; };
if (location.search.includes('expired')) msg('Сессия истекла. Войдите снова.', 'err');

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const login = $('#login').value.trim(), password = $('#password').value;
  if (!login || !password) return msg('Заполните логин и пароль', 'err');
  const res = await fetch('/api/login', {
    method: 'POST', credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ login, password }),
  });
  const data = await res.json().catch(() => ({}));
  $('#password').value = '';
  if (!res.ok) return msg(data.error || 'Ошибка входа', 'err');
  location.href = data.role === 'teacher' ? '/teacher' : '/student';
});
</script></body></html>
